name: Compilar MG WIRE APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build MG WIRE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Extrair projeto
        run: |
          unzip -t HyperS-MG-Login-Updated.zip
          mkdir -p "$RUNNER_TEMP/mg-wire"
          unzip -q HyperS-MG-Login-Updated.zip \
            -d "$RUNNER_TEMP/mg-wire"

          PROJECT="$RUNNER_TEMP/mg-wire/HyperS-free"

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/gradlew"
          test -f "$PROJECT/gradle/wrapper/gradle-wrapper.jar"

          chmod +x "$PROJECT/gradlew"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Compilar MG WIRE
        run: |
          cd "$PROJECT"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Preparar APK
        run: |
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/MG-WIRE.apk"

      - name: Disponibilizar MG WIRE
        uses: actions/upload-artifact@v4
        with:
          name: MG-WIRE
          path: MG-WIRE.apk
          if-no-files-found: error
