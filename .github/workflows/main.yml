name: Compilar MG WIRE APK

on:
push:
branches:
- main
- master
workflow_dispatch:

jobs:
build:
name: Build MG WIRE
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK platforms
    run: |
      yes | sdkmanager --licenses || true
      sdkmanager "platform-tools" \
        "platforms;android-34" \
        "platforms;android-35" \
        "platforms;android-36" \
        "build-tools;34.0.0"

  - name: Find Gradle wrapper
    id: gradle
    shell: bash
    run: |
      GRADLEW="$(find . -type f -name gradlew -not -path './.git/*' -print -quit)"
      if [ -z "$GRADLEW" ]; then
        echo "ERRO: arquivo gradlew não encontrado."
        exit 1
      fi
      PROJECT_DIR="$(dirname "$GRADLEW")"
      chmod +x "$GRADLEW"
      echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

  - name: Build Debug APK
    shell: bash
    run: |
      cd "${{ steps.gradle.outputs.project_dir }}"
      ./gradlew --no-daemon assembleDebug

  - name: Rename APK
    shell: bash
    run: |
      PROJECT_DIR="${{ steps.gradle.outputs.project_dir }}"
      APK_PATH="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
      if [ -z "$APK_PATH" ]; then
        echo "ERRO: APK Debug não encontrado."
        exit 1
      fi
      cp "$APK_PATH" "$GITHUB_WORKSPACE/MG-WIRE.apk"
      test -s "$GITHUB_WORKSPACE/MG-WIRE.apk"

  - name: Upload MG WIRE APK
    uses: actions/upload-artifact@v4
    with:
      name: MG-WIRE
      path: MG-WIRE.apk
      if-no-files-found: error
