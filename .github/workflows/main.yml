
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV

      - name: Instalar componentes Android
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-30" \
            "build-tools;30.0.3"

      - name: Configurar Gradle 7.3.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.3.3'

      - name: Compilar APK
        run: gradle :app:assembleRelease

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-MODZ-VPN-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
