name: Compilar MG WIRE APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build MG WIRE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Localizar Gradle
        id: gradle
        run: |
          FILE=$(find . -type f -name gradlew -not -path './.git/*' -print -quit)
          if [ -z "$FILE" ]; then
            echo "Gradle wrapper não encontrado"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          chmod +x "$FILE"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        run: |
          cd "${{ steps.gradle.outputs.dir }}"
          ./gradlew --no-daemon assembleDebug

      - name: Preparar MG WIRE
        run: |
          APK=$(find "${{ steps.gradle.outputs.dir }}" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" MG-WIRE.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-WIRE
          path: MG-WIRE.apk
          if-no-files-found: error
