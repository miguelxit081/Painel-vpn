name: Compilar APK Android

on:
push:
branches:
- main
- master
workflow_dispatch:

jobs:
build:
name: Build Debug APK
runs-on: ubuntu-latest

steps:
  - name: Baixar código do repositório
    uses: actions/checkout@v4

  - name: Verificar arquivos do projeto
    run: |
      echo "Arquivos do repositório:"
      ls -la
      echo "Procurando projeto Android:"
      find . -maxdepth 4 \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \)

  - name: Configurar Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Configurar Android SDK
    uses: android-actions/setup-android@v3

  - name: Instalar Android SDK 34
    run: |
      yes | sdkmanager --licenses || true
      sdkmanager "platform-tools" \
                 "platforms;android-34" \
                 "build-tools;34.0.0"

  - name: Preparar Gradle
    working-directory: HyperS-free
    run: chmod +x gradlew

  - name: Compilar APK Debug
    working-directory: HyperS-free
    run: ./gradlew --no-daemon assembleDebug

  - name: Enviar APK compilado
    uses: actions/upload-artifact@v4
    with:
      name: mg-debug-apk
      path: mg/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
