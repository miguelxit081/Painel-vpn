name: Compilar MG WIRE APK

on:
push:
branches:
- main
- master
workflow_dispatch:

jobs:
build:
name: Build MG WIRE
runs-on: ubuntu-latest

steps:
  - name: Baixar código do repositorio
    uses: actions/checkout@v4

  - name: Configurar Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Configurar Android SDK
    uses: android-actions/setup-android@v3

  - name: Instalar Android SDK 34
    run: |
      yes | sdkmanager --licenses || true
      sdkmanager "platform-tools" \
        "platforms;android-34" \
        "build-tools;34.0.0"

  - name: Verificar projeto
    run: |
      ls -la
      ls -la HyperS-free
      test -f HyperS-free/gradlew

  - name: Preparar Gradle
    working-directory: HyperS-free
    run: chmod +x gradlew

  - name: Compilar MG WIRE
    working-directory: HyperS-free
    run: ./gradlew --no-daemon assembleDebug

  - name: Renomear APK
    run: |
      cp HyperS-free/app/build/outputs/apk/debug/app-debug.apk MG-WIRE.apk

  - name: Enviar APK compilado
    uses: actions/upload-artifact@v4
    with:
      name: MG-WIRE
      path: MG-WIRE.apk
      if-no-files-found: error
