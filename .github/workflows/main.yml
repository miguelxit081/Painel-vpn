name: Compilar MG WIRE APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build MG WIRE
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: platform-tools

      - name: Instalar plataformas Android
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Localizar Gradle
        id: gradle
        shell: bash
        run: |
          FILE=$(find . -type f -name gradlew -not -path './.git/*' -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERRO: gradlew nao encontrado"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          chmod +x "$FILE"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Compilar aplicativo
        run: |
          cd "${{ steps.gradle.outputs.dir }}"
          ./gradlew --no-daemon assembleDebug

      - name: Preparar MG WIRE
        run: |
          APK=$(find "${{ steps.gradle.outputs.dir }}" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "APK nao encontrado"
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/MG-WIRE.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-WIRE
          path: MG-WIRE.apk
          if-no-files-found: error
